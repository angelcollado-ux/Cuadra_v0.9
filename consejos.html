<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consejos financieros - Calcula tu sueldo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="auth.js"></script>
  <script>if (!usuarioActual()) location.replace("login.html");</script>
</head>
<body>
<div id="navbar" data-activa="consejos"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h1 class="h5 mb-0"><i class="bi bi-stars me-2"></i>Consejos financieros</h1>
      <input type="month" id="mesSel" class="form-control form-control-sm w-auto" aria-label="Mes a consultar">
    </div>

    <section class="panel mb-3">
      <h2 class="panel-title"><i class="bi bi-person-check me-2"></i>Consejos para tu bolsillo</h2>
      <div id="listaConsejos"></div>
      <p id="sinConsejos" class="vacio d-none mb-0">Agrega tus ingresos y gastos en <a href="index.html">Inicio</a> para recibir consejos personalizados de este mes.</p>
      <p class="small text-secondary mb-0 mt-3">Son estimaciones según los datos que ingresaste. Se actualizan solos cuando cambias algo.</p>
    </section>

    <section class="panel">
      <h2 class="panel-title"><i class="bi bi-lightbulb me-2"></i>Consejos básicos de ahorro</h2>
      <div id="listaTips"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="consejos.js"></script>
  <script src="nav.js"></script>
  <script src="pagina-consejos.js"></script>
</body>
</html>
